<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Foundation Inspector Pro</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15202b;background:#eef2f6}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:30;background:#083a73;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.86;margin:3px 0 8px}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:7px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid #c8d0d9;border-radius:10px;padding:10px;background:#fff}button{border:0;border-radius:10px;padding:10px 12px;font-weight:800;background:#0b67c2;color:#fff}.secondary{background:#e7edf4;color:#16202a}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;height:calc(100vh - 112px)}.map-shell{overflow:auto;position:relative;background:#66717c;-webkit-overflow-scrolling:touch}.map{position:relative;width:1800px;line-height:0;background:#fff}.map img{display:block;width:100%;height:auto}.pins,.gps-layer{position:absolute;inset:0;pointer-events:none}.pin{pointer-events:auto;position:absolute;width:19px;height:19px;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #fff;background:#737d87;box-shadow:0 1px 4px #0008;color:#fff;line-height:15px;text-align:center;font-size:7px;font-weight:900;padding:0}.pin.known{background:#16803d}.pin.issue{background:#c32727}.pin.nearest{width:31px;height:31px;line-height:27px;font-size:10px;background:#ff9f0a;z-index:6}.pin.selected{outline:4px solid #fff9;z-index:7}.blue-dot{position:absolute;width:22px;height:22px;transform:translate(-50%,-50%);border-radius:50%;background:#0a84ff;border:4px solid #fff;box-shadow:0 1px 8px #0008;z-index:12}.accuracy{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:#0a84ff22;border:1px solid #0a84ff88;z-index:10}.panel{background:#fff;border-left:1px solid #cbd3dc;padding:12px;overflow:auto}.card{border:1px solid #d7dee7;border-radius:14px;padding:12px;margin-bottom:10px}.card h2{margin:0 0 8px;font-size:19px}.label{font-size:12px;color:#66717c;margin-top:8px;display:block}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tiny{font-size:12px;color:#687480}.statusbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800;background:#edf1f5}.pill.blue{background:#dceeff;color:#0058a8}.pill.green{background:#dff4e5;color:#12642f}.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.photo-grid img{width:100%;height:105px;object-fit:cover;border-radius:8px}.empty{text-align:center;color:#6d7883;padding:25px 8px}.legend{position:fixed;left:10px;bottom:10px;z-index:20;background:#fffe;padding:7px 9px;border-radius:10px;font-size:11px;box-shadow:0 2px 10px #0003}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px}.notice{background:#fff4cc;border:1px solid #f0cc55;border-radius:10px;padding:9px;font-size:12px;margin-bottom:9px}@media(max-width:760px){header{position:relative}.toolbar{grid-template-columns:1fr auto}.toolbar button:last-child{grid-column:1/-1}.layout{display:block;height:auto}.map-shell{height:58vh}.map{width:1500px}.panel{border-left:0;border-top:1px solid #ccd4dd;min-height:42vh}.legend{bottom:43vh}}
</style>
</head>
<body>
<header><h1>Foundation Inspector Pro</h1><div class="sub">ORD caisson field map · live GPS · offline records</div><div class="toolbar"><input id="search" type="number" inputmode="numeric" placeholder="Caisson number"><button id="find">Find</button><button id="locate">Start Blue Dot</button></div></header>
<div class="layout"><section class="map-shell" id="mapShell"><div class="map" id="map"><img src="../-ORD-Caisson-Inspector/caisson-plan.png" alt="ORD caisson plan"><div class="pins" id="pins"></div><div class="gps-layer" id="gpsLayer"></div></div></section><aside class="panel" id="panel"><div class="empty">Loading ORD caisson plan…</div></aside></div>
<div class="legend"><span class="dot" style="background:#0a84ff"></span>You &nbsp;<span class="dot" style="background:#16803d"></span>GPS saved &nbsp;<span class="dot" style="background:#ff9f0a"></span>Nearest</div>
<script>
const OLD_INDEX='../-ORD-Caisson-Inspector/index.html',OLD_KEY='ordCaissonRecords',NEW_KEY='foundationInspectorRecords';let HOTSPOTS=[],records={},selected=null,nearest=null,watchId=null,transform=null,lastPosition=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':'&quot;'}[m]));const num=v=>{const n=Number(v);return Number.isFinite(n)?n:null};
function loadRecords(){const old=JSON.parse(localStorage.getItem(OLD_KEY)||'{}'),newer=JSON.parse(localStorage.getItem(NEW_KEY)||'{}');records={...old,...newer};localStorage.setItem(NEW_KEY,JSON.stringify(records))}function save(){localStorage.setItem(NEW_KEY,JSON.stringify(records));renderPins();fitTransform()}function rec(n){return records[n]||{status:'No information',verified:false,notes:'',lat:null,lon:null,condition:'',updated:'',photos:[]}}
async function loadHotspots(){const text=await fetch(OLD_INDEX,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('ORD plan data unavailable');return r.text()}),m=text.match(/const HOTSPOTS=(\[[\s\S]*?\]);\s*const STARTING=/);if(!m)throw Error('Could not read caisson locations');HOTSPOTS=JSON.parse(m[1]);renderPins();fitTransform();$('panel').innerHTML='<div class="empty">Tap a caisson or start the blue dot.</div>'}
function pinClass(r,n){let c='pin';if(num(r.lat)!=null&&num(r.lon)!=null)c+=' known';if(/repair|issue|review/i.test(r.status||''))c+=' issue';if(n===nearest)c+=' nearest';if(n===selected)c+=' selected';return c}function renderPins(){if(!HOTSPOTS.length)return;$('pins').innerHTML=HOTSPOTS.map(h=>`<button class="${pinClass(rec(h.caisson),h.caisson)}" data-n="${h.caisson}" style="left:${h.x}%;top:${h.y}%">${h.caisson}</button>`).join('');document.querySelectorAll('.pin').forEach(p=>p.onclick=()=>selectCaisson(+p.dataset.n))}
function selectCaisson(n){selected=n;renderPins();const r=rec(n),distance=lastPosition&&num(r.lat)!=null?Math.round(haversine(lastPosition.coords.latitude,lastPosition.coords.longitude,+r.lat,+r.lon)*3.28084):null;$('panel').innerHTML=`<div class="card"><h2>Caisson ${n}</h2><div class="statusbar"><span class="pill ${r.verified?'green':''}">${r.verified?'GPS verified':'Not verified'}</span>${distance!=null?`<span class="pill blue">${distance} ft away</span>`:''}</div><label class="label">Status</label><select id="status">${['No information','Verified GPS','Needs photos','Needs review','Repair required','Accepted','Backfilled'].map(x=>`<option ${r.status===x?'selected':''}>${x}</option>`).join('')}</select><div class="row"><div><label class="label">Latitude</label><input id="lat" type="number" step="any" value="${r.lat??''}"></div><div><label class="label">Longitude</label><input id="lon" type="number" step="any" value="${r.lon??''}"></div></div><button id="useGPS" style="margin-top:8px;width:100%">Use Current GPS</button><label class="label">Condition / stage</label><input id="condition" value="${esc(r.condition)}"><label class="label">Notes</label><textarea id="notes" rows="4">${esc(r.notes)}</textarea><label class="label"><input id="verified" type="checkbox" style="width:auto" ${r.verified?'checked':''}> GPS/location verified</label><button id="save" style="margin-top:8px;width:100%">Save</button></div><div class="card"><h2>Photos</h2><input id="photos" type="file" accept="image/*" multiple><button id="addPhotos" class="secondary" style="margin-top:8px;width:100%">Add Photos</button><div id="photoGrid" class="photo-grid" style="margin-top:8px"></div><div class="tiny">Existing ORD photos on this phone are available.</div></div>`;$('save').onclick=()=>{records[n]={...r,status:$('status').value,lat:num($('lat').value),lon:num($('lon').value),condition:$('condition').value,notes:$('notes').value,verified:$('verified').checked,updated:new Date().toISOString(),photos:r.photos||[]};save();selectCaisson(n)};$('useGPS').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{records[n]={...r,lat:p.coords.latitude,lon:p.coords.longitude,verified:true,status:r.status==='No information'?'Verified GPS':r.status,updated:new Date().toISOString(),photos:r.photos||[]};save();selectCaisson(n)},geoError,{enableHighAccuracy:true,timeout:15000});$('addPhotos').onclick=()=>addPhotos(n);showPhotos(n);scrollToSpot(n)}
function scrollToSpot(n){const h=HOTSPOTS.find(x=>x.caisson===n);if(!h)return;const shell=$('mapShell'),map=$('map');shell.scrollTo({left:map.offsetWidth*h.x/100-shell.clientWidth/2,top:map.offsetHeight*h.y/100-shell.clientHeight/2,behavior:'smooth'})}
function openDB(){return new Promise((res,rej)=>{const q=indexedDB.open('ordCaissonPhotos',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('photos'))q.result.createObjectStore('photos',{keyPath:'id'})};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}async function addPhotos(n){const files=[...$('photos').files];if(!files.length)return;const db=await openDB(),tx=db.transaction('photos','readwrite'),store=tx.objectStore('photos'),r=rec(n);r.photos=r.photos||[];for(const f of files){const id=`${n}-${Date.now()}-${Math.random()}`;store.put({id,caisson:n,name:f.name,type:f.type,blob:f,date:new Date().toISOString()});r.photos.push(id)}records[n]=r;save();tx.oncomplete=()=>selectCaisson(n)}async function showPhotos(n){const grid=$('photoGrid'),ids=rec(n).photos||[];if(!ids.length){grid.innerHTML='<span class="tiny">No photos.</span>';return}try{const db=await openDB(),store=db.transaction('photos').objectStore('photos');const photos=await Promise.all(ids.map(id=>new Promise(resolve=>{const q=store.get(id);q.onsuccess=()=>resolve(q.result);q.onerror=()=>resolve(null)})));grid.innerHTML=photos.filter(Boolean).map(p=>`<img src="${URL.createObjectURL(p.blob)}" alt="${esc(p.name)}">`).join('')}catch{grid.innerHTML='<span class="tiny">Photos could not be opened.</span>'}}
function solve3(A,b){A=A.map((r,i)=>[...r,b[i]]);for(let i=0;i<3;i++){let p=i;for(let j=i+1;j<3;j++)if(Math.abs(A[j][i])>Math.abs(A[p][i]))p=j;[A[i],A[p]]=[A[p],A[i]];if(Math.abs(A[i][i])<1e-14)return null;for(let j=i+1;j<3;j++){const f=A[j][i]/A[i][i];for(let k=i;k<4;k++)A[j][k]-=f*A[i][k]}}const x=[0,0,0];for(let i=2;i>=0;i--){x[i]=(A[i][3]-A[i].slice(i+1,3).reduce((s,v,k)=>s+v*x[i+1+k],0))/A[i][i]}return x}function regress(points,key){const M=[[0,0,0],[0,0,0],[0,0,0]],b=[0,0,0];for(const p of points){const v=[p.lon,p.lat,1],y=p[key];for(let i=0;i<3;i++){b[i]+=v[i]*y;for(let j=0;j<3;j++)M[i][j]+=v[i]*v[j]}}return solve3(M,b)}function fitTransform(){const pts=HOTSPOTS.map(h=>{const r=rec(h.caisson);return num(r.lat)!=null&&num(r.lon)!=null?{lat:+r.lat,lon:+r.lon,x:h.x,y:h.y}:null}).filter(Boolean);if(pts.length<3){transform=null;return}const ax=regress(pts,'x'),ay=regress(pts,'y');transform=ax&&ay?{ax,ay,count:pts.length}:null}function project(lat,lon){if(!transform)return null;return{x:transform.ax[0]*lon+transform.ax[1]*lat+transform.ax[2],y:transform.ay[0]*lon+transform.ay[1]*lat+transform.ay[2]}}
function haversine(a,b,c,d){const R=6371000,t=Math.PI/180,da=(c-a)*t,db=(d-b)*t,q=Math.sin(da/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin(db/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function nearestKnown(lat,lon){let best=null;for(const h of HOTSPOTS){const r=rec(h.caisson);if(num(r.lat)==null||num(r.lon)==null)continue;const d=haversine(lat,lon,+r.lat,+r.lon);if(!best||d<best.d)best={n:h.caisson,d}}return best}
function updateGPS(p){lastPosition=p;const lat=p.coords.latitude,lon=p.coords.longitude,best=nearestKnown(lat,lon);nearest=best?.n??null;renderPins();const q=project(lat,lon),layer=$('gpsLayer');if(!q){layer.innerHTML='';$('panel').innerHTML='<div class="notice">At least three saved green GPS caissons are needed to place the blue dot.</div>';return}const map=$('map'),metersPerPctX=Math.max(.01,haversine(lat,lon,lat,lon+.00001)/(Math.abs(project(lat,lon+.00001).x-q.x)||.001)/100),pxPerPct=map.offsetWidth/100,r=Math.max(18,(p.coords.accuracy/metersPerPctX)*pxPerPct*2);layer.innerHTML=`<div class="accuracy" style="left:${q.x}%;top:${q.y}%;width:${r}px;height:${r}px"></div><div class="blue-dot" style="left:${q.x}%;top:${q.y}%"></div>`;if(best){$('panel').innerHTML=`<div class="card"><h2>Nearest: Caisson ${best.n}</h2><div class="pill blue">${Math.round(best.d*3.28084)} ft away</div><p class="tiny">GPS accuracy ±${Math.round(p.coords.accuracy*3.28084)} ft · fitted from ${transform.count} saved locations.</p><button id="openNearest" style="width:100%">Open Caisson ${best.n}</button></div>`;$('openNearest').onclick=()=>selectCaisson(best.n)}}function geoError(e){alert('GPS could not start: '+e.message+'\nAllow Location access for this website in iPhone Settings.')}
$('locate').onclick=()=>{if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;$('locate').textContent='Start Blue Dot';$('gpsLayer').innerHTML='';nearest=null;renderPins();return}watchId=navigator.geolocation.watchPosition(updateGPS,geoError,{enableHighAccuracy:true,maximumAge:1000,timeout:20000});$('locate').textContent='Stop Blue Dot'};$('find').onclick=()=>{const n=+$('search').value;if(HOTSPOTS.some(h=>h.caisson===n))selectCaisson(n);else alert('Caisson not found')};$('search').onkeydown=e=>{if(e.key==='Enter')$('find').click()};loadRecords();loadHotspots().catch(e=>$('panel').innerHTML=`<div class="notice">${esc(e.message)}. Open the ORD app once while online, then reload.</div>`);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
